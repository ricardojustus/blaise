<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Blaise Meet Companion — Options</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #1c1c1e; color: #e8e8ed; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    label { display: block; margin: 1rem 0 0.3rem; color: #aeaeb5; font-size: 0.85rem; }
    input { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #e8e8ed; font-family: ui-monospace, monospace; }
    button { margin-top: 0.8rem; padding: 0.45rem 1rem; border-radius: 6px; border: none; background: #0a84ff; color: white; font-weight: 500; cursor: pointer; }
    #status { margin-top: 1rem; font-size: 0.85rem; color: #aeaeb5; white-space: pre-line; }
    .note { margin-top: 1.5rem; font-size: 0.78rem; color: #8e8e93; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Blaise Meet Companion</h1>
  <label for="secret">Shared secret (from Blaise → Settings → Meet extension)</label>
  <input id="secret" type="password" autocomplete="off" spellcheck="false" />
  <button id="save">Save</button>
  <div id="status"></div>
  <p class="note">
    Captured data: participant display names, speaking start/end times, and
    the meeting code — nothing else. Everything is AES-256-GCM encrypted and
    sent only to the Blaise app at 127.0.0.1:18429. If the app is offline,
    events buffer locally and retry silently.
  </p>
  <script src="options.js"></script>
</body>
</html>
